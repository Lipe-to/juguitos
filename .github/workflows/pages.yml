name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        id: pages
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm test
      - name: Gerar site
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_USE_EMULATORS: 'false'
          VITE_MINES_API_URL: ${{ vars.VITE_MINES_API_URL }}
        run: |
          : "${VITE_FIREBASE_API_KEY:?Configure as variáveis públicas de Firebase no repositório}"
          : "${VITE_FIREBASE_AUTH_DOMAIN:?VITE_FIREBASE_AUTH_DOMAIN ausente}"
          : "${VITE_FIREBASE_PROJECT_ID:?VITE_FIREBASE_PROJECT_ID ausente}"
          : "${VITE_FIREBASE_APP_ID:?VITE_FIREBASE_APP_ID ausente}"
          : "${VITE_MINES_API_URL:?VITE_MINES_API_URL ausente}"
          pnpm build --mode pages --base "${PAGES_BASE%/}/"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
